# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - nodeazureapiback

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:

  AZURE_WEBAPP_NAME: NodeApiAzure
  NODE_VERSION: '24.x'
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  # Build and test job runs on every push and PR
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci --omit=dev
          npm run build --if-present

      - name: Create deployment package
        run: |
          # Remove dev dependencies for a smaller deployment
          npm prune --production
          # Create a zip file for deployment
          zip -r deploy.zip . -x "tests/*" ".github/*" "*.test.js" ".git/*"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'nodeazureapiback'
          slot-name: 'Production'
          package: deploy.zip
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_B43D4CE67F66462FA0B8BE01011F79A0 }}