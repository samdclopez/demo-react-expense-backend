# .github/workflows/deploy.yml
name: Build and Deploy to Azure

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  AZURE_WEBAPP_NAME: nodeapiazure-gmdzhkb6gkhdc3gr.canadacentral-01
  NODE_VERSION: '20.x'

jobs:
  # Build and test job runs on every push and PR
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install
          npm run build --if-present

      - name: Run tests
        run: npm test

      - name: Create deployment package
        run: |
          # Remove dev dependencies for a smaller deployment
          npm prune --production
          # Create a zip file for deployment
          zip -r deploy.zip . -x "tests/*" ".github/*" "*.test.js" ".git/*"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-package
          path: deploy.zip

  # Deploy job only runs on push to main (not on PRs)
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test

    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app-package

      - name: Deploy to Azure Web App
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: deploy.zip

      - name: Verify deployment
        run: |
          sleep 30
          curl -f https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/health || exit 1
          echo "Deployment verified successfully"
